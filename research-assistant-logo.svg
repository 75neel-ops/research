<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3978F6"/>
      <stop offset="100%" stop-color="#6855D9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28C6B7"/>
      <stop offset="100%" stop-color="#148EAA"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="20" y="20" width="180" height="180" rx="42" fill="#F1F5FF"/>

  <!-- Book pages -->
  <path d="M52 77
           C75 68 98 72 110 82
           L110 145
           C94 135 73 133 52 142 Z"
        fill="white" stroke="url(#blue)" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M110 82
           C126 72 148 68 169 77
           L169 142
           C148 133 128 135 110 145 Z"
        fill="white" stroke="url(#blue)" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M110 82 L110 145" fill="none" stroke="#3978F6" stroke-width="6"/>

  <!-- Book text lines -->
  <path d="M67 94 C80 90 91 92 100 96
           M67 108 C80 104 91 106 100 110
           M121 96 C133 92 145 90 156 94
           M121 110 C133 106 145 104 156 108"
        fill="none" stroke="#A7B9E8" stroke-width="4"
        stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="146" cy="139" r="25" fill="white"
          stroke="url(#teal)" stroke-width="8"/>
  <path d="M164 157 L181 174" stroke="url(#teal)"
        stroke-width="10" stroke-linecap="round"/>

  <!-- Small research nodes -->
  <circle cx="49" cy="55" r="7" fill="#28C6B7"/>
  <circle cx="70" cy="47" r="5" fill="#3978F6"/>
  <path d="M55 53 L65 49" stroke="#8CA4E8" stroke-width="3"/>

  <!-- Wordmark -->
  <text x="230" y="103"
        font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700" fill="#17233F">
    Research
  </text>
  <text x="230" y="150"
        font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700" fill="url(#blue)">
    Assistant
  </text>
  <text x="232" y="179"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" letter-spacing="2" fill="#66738F">
